    input: 0.20
    output: 1.25
    source: "USD/1M token chuẩn. Bảng BTC thiếu model này và hướng dẫn tra nguồn nhà cung cấp. OpenAI, xem 28/11/2026, https://developers.openai.com/api/docs/models/gpt-5.4-nano (cached input 0,02)."
  - model: gpt-5.4-mini
    input: 0.75
