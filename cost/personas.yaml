# CP4, Track D1. Chi phí API model bằng USD, chưa thuế.
# Không gồm hạ tầng, nhân viên hỗ trợ hoặc chi phí xử lý giao dịch.
# Sau khi chấm đủ run-2, chạy python run.py simulate --rate-from eval/run-2.csv.
# Đo token trên gpt-5.4-nano. Dòng mini chỉ áp đơn giá khác lên cùng token.
# Một phiên = một yêu cầu trợ lý. Mỗi yêu cầu hiện có hai lời gọi model.
# Simulator đã cộng token của hai lời gọi, không nhân thêm hệ số 2.
# Q2 (20 phiếu): 16 đặt 1–3 đơn, 2 đặt 4–8 đơn, 2 đặt trên 8 đơn/tháng.
# Q2 đo đơn đặt. Share 50% / 35% / 15% là phân bố giả định theo spec.md §2.
# Giả định mỗi lần muốn hủy trong lát cắt sinh một phiên, mỗi phiên một lượt hỏi.
# Chưa đo tỷ lệ tiếp nhận trợ lý hoặc số lượt hỏi thực tế. Không coi mỗi đơn là một phiên.
# Giá cache chỉ ghi tham khảo. Simulator tính toàn bộ token vào theo giá input chuẩn.

sessions: 50
seed: 42

users:
  low: 41000
  base: 205000
  high: 410000
  source: "(tự ước tính, chờ nhóm xác nhận) Kịch bản triển khai tại Việt Nam, lấy 1%, 5%, 10% của mốc tham chiếu 4,1 triệu người dùng tiềm năng được tiếp cận thêm. Znews 12/07/2024, https://znews.vn/shopeefood-but-pha-nho-van-dung-ai-vao-dich-vu-goi-mon-truc-tuyen-post1485989.html. Đây là quy mô giả định của tệp được triển khai, không phải số người dùng thật đã xác minh, MAU hay tỷ lệ tiếp nhận đã đo."

personas:
  - name: dung_it
    share: 0.50
    uses_per_month: 0.10
    turns_per_session: 1
    source: "(tự ước tính) spec.md §2 nhóm 1–3 đơn/tháng, khoảng 0,1 lần muốn hủy/tháng. Đối chiếu Q2 evidence/survey/results.csv, 16/20 thuộc dải đơn đặt này."
  - name: dung_vua
    share: 0.35
    uses_per_month: 0.30
    turns_per_session: 1
    source: "(tự ước tính) spec.md §2 nhóm 4–8 đơn/tháng, khoảng 0,3 lần muốn hủy/tháng. Đối chiếu Q2 evidence/survey/results.csv, 2/20 thuộc dải đơn đặt này."
  - name: dung_nhieu
    share: 0.15
    uses_per_month: 1.00
    turns_per_session: 1
    source: "(tự ước tính) spec.md §2 nhóm trên 8 đơn/tháng, khoảng 1 lần muốn hủy/tháng. Đối chiếu Q2 evidence/survey/results.csv, 2/20 thuộc dải đơn đặt này."

prices:
